name: update-data

# Refresh data/rates.json from the Riksbank and SCB every weekday evening.
# The job commits only when the data actually changed, and only after validation passes,
# so a failed or partial fetch never replaces good data. Each commit triggers a redeploy.
on:
  schedule:
    - cron: "15 17 * * 1-5"   # 18:15 Stockholm (winter time), after the Riksbank's daily publication
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test pipeline
        run: pip install pytest && pytest -q pipeline/tests
      - name: Fetch and validate
        run: python pipeline/fetch_data.py
      - name: Commit if changed
        run: |
          # `git status` (not `git diff`) so a brand-new file counts as a change too.
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes"; exit 0
          fi
          git config user.name "rates-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "data: update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
